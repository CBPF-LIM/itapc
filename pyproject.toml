[tool.poetry]
name = "itaserver"
version = "0.1.1"
description = "ItaServer has the same functionality as the Ita (AppScript), but it is a PC application."
authors = ["David Vaz Teixeira <dvt4qb@gmail.com>"]
readme = "README.md"
packages = [
  { include = "app" },
  { include = "tools" }
]

[tool.poetry.dependencies]
python = "^3.10"
Flask = "^3.0.3"
requests = "^2.32.3"
flask-socketio = "^5.3.6"
eventlet = "^0.36.1"
jinja-partials = "^0.2.1"
peewee = "^3.17.6"
tabulate = "^0.9.0"
PyYAML = "^6.0.2"
python-dotenv = "^1.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"
pytest-flask = "^1.3.0"
ipdb = "^0.13.13"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
itaserver = "app.main:main"
