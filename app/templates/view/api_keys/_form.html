{% if api_key.id %}
  <h1>Edit: {{api_key.name}}</h1>
{% else %}
  <h1>New ApiKey</h1>
{% endif %}
<hr>

<form action="{{ action }}" method="post">
  <div class="input-group mb-3">
    <span class="input-group-text">Name</span>
    <input name="name" type="text" value="{{ api_key.name }}" class="form-control" placeholder="Name">
  </div>

  <button type="submit" class='btn btn-primary'>Save</button>
</form>
