{% block js %}
  <script src="/static/js/tools.js"></script>
{% endblock %}

{% block css %}
  <link rel="stylesheet" href="/static/css/tools.css">
{% endblock %}

<section class="tools">
  <h1>Data Tools: {{experiment.name}}</h1>
  <span id="experiment-id" data-id="{{experiment.id}}"></span>
  <hr>

  <h2>Cols</h2>
  <div class="row">
    <div class="col-md-6 col-xs-12">
      <div class="input-group mb-3">
        <button class="btn btn-outline-secondary" type="button" id="post-button">Send</button>
        <textarea id="cols" name="cols" type="text" class="form-control" rows="6"></textarea>
      </div>
      <div>
        Templates:
        <button class='btn btn-outline-primary' onclick="loadSimpleTemplate()">Simple</button>
        <button class='btn btn-outline-primary' onclick="loadAuthTemplate()">Auth</button>
      </div>
    </div>
    <div class="col-md-6 col-xs-12">
      <div class="card">
        <div class="card-body">
          <pre id="post-output" class="output"></pre>
        </div>
      </div>
    </div>
  </div>

  <h2>Command</h2>
  <div class="row">
    <div class="col-md-6 col-xs-12">
      <div class="input-group mb-3">
        <button class="btn btn-outline-secondary" type="button" id="cmd-button">Send</button>
        <input id="cmd" name="cmd" type="text" class="form-control" placeholder="configs">
      </div>
    </div>
    <div class="col-md-6 col-xs-12">
      <div class="card">
        <div class="card-body">
          <pre id="cmd-output" class="output"></pre>
        </div>
      </div>
    </div>
  </div>

  <h2>Config</h2>
  <div class="row">
    <div class="col-md-6 col-xs-12">
      <div class="input-group mb-3">
        <button class="btn btn-outline-secondary" type="button" id="config-button">Send</button>
        <input id="config" name="config" type="text" class="form-control" placeholder="">
      </div>
    </div>
    <div class="col-md-6 col-xs-12">
      <div class="card">
        <div class="card-body">
          <pre id="config-output" class="output"></pre>
        </div>
      </div>
    </div>
  </div>
</section>
