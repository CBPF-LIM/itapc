{% if experiment.id %}
  <h1>Edit<h1>
  <h2>Experiment {{ experiment.id }}</h2>
{% else %}
  <h1>New Experiment</h1>
{% endif %}
<hr>

<form action="{{ action }}" method="post">
  <div class="input-group mb-3">
    <span class="input-group-text">Name</span>
    <input name="name" type="text" value="{{ experiment.name }}" class="form-control" placeholder="Separated with comma">
  </div>

  <div class="input-group mb-3">
    <span class="input-group-text">Headers</span>
    <input name="header_string" type="text" value="{{ experiment.header_string }}" class="form-control" placeholder="Separated with comma">
  </div>

  <div class="input-group mb-3">
    <span class="input-group-text">Setting</span>
    <select name="setting" class="form-select">
      <option value="" {% if not experiment.setting %}selected{% endif %}>Select setting</option>
      {% for setting in settings %}
        <option value="{{ setting.id }}" {% if experiment.setting.id == setting.id %}selected{% endif %}>
          {{ setting.id }} - {{ setting.name }}
        </option>
      {% endfor %}
    </select>
  </div>


  <button type="submit" class='btn btn-primary'>Save</button>
</form>
