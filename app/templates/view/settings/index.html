<h1>Settings</h1>
<hr>

<a href="{{ action_for('.new') }}" class="btn btn-primary">New</a>

<table class="table table-striped table-responsive">
    <thead>
        <tr>
            <th>ID</th>
            <th>Created at</th>
            <th>Updated at</th>
            <th>Configuration</th>
        </tr>
    </thead>
    <tbody>
        {% for setting in settings %}
        <tr>
            <td>
              <a href="{{ action_for('.edit', id=setting.id) }}">Setting {{setting.id}}</a>
            </td>
            <td>{{ setting.created_at }}</td>
            <td>{{ setting.updated_at }}</td>
            <td>
              <details>
                <summary>Details</summary>
                <table class="table table-bordered table-striped table-condensed">
                  <thead>
                  <tr>
                    <th>Key</th>
                    <th>Value</th>
                  </tr>
                </thead>
                  <tbody>
                  {% for key, value in setting.config.items() %}
                    <tr>
                      <td>
                        {{ key }}
                      </td>
                      <td>
                        {{ value if value.strip() else 'N/A' }}
                      </td>
                    </tr>
                  {% endfor %}
                  </tbody>
                </table>
              </details>
        </tr>
        {% endfor %}
    </tbody>
</table>
