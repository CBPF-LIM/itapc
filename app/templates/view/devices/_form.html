{% if device.id %}
  <h1>Edit: {{device.name}}</h1>
{% else %}
  <h1>New Device</h1>
{% endif %}
<hr>

<form action="{{ action }}" method="post">
  <div class="input-group mb-3">
    <span class="input-group-text">Name</span>
    <input name="name" type="text" value="{{ device.name }}" class="form-control" placeholder="Name">
  </div>

  <div class="input-group mb-3">
    <span class="input-group-text">Hash</span>
    <input name="hash" type="text" value="{{ device.hash }}" class="form-control" placeholder="Hash">
  </div>

  <button type="submit" class='btn btn-primary'>Save</button>
</form>
